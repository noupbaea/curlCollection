<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz — Curl Collection</title>
<link rel="stylesheet" href="/assets/curls.css">
</head>
<body>
<div class="page">
  <header class="site-header">
    <a class="brand" href="/"><img src="/assets/logo.svg" alt="Curl Collection logo"><h1>Curl Collection</h1></a>
    <nav class="site-nav"><a href="/quiz" class="active">Quiz</a><a href="/browse">Browse</a></nav>
  </header>
  <main class="site-main">
    <section class="intro">
      <h2>Do you have any hair concerns?</h2>
      <p>This question is optional.</p>
    </section>
    <form id="q" class="con-grid">
      <!-- filled by JS -->
    </form>
    <div class="nav-row">
      <a class="next" id="next" href="/quiz/products">Next →</a>
      <a class="back" href="/quiz/porosity">← Back</a>
    </div>
  </main>
  <footer>Powered by <a href="https://blackhairapi.com" target="_blank" rel="noopener noreferrer">www.blackhairapi.com</a></footer>
</div>
<script src="/assets/quiz.js"></script>
<script>
const OPTS = [
  { v: "dryness", label: "Dryness", img: "/assets/hairConcerns/dryness.jpg" },
  { v: "frizz", label: "Frizz", img: "/assets/hairConcerns/frizz.jpg" },
  { v: "definition", label: "Definition", img: "/assets/hairConcerns/definition.jpg" },
  { v: "moisture", label: "Moisture Retention", img: "/assets/hairConcerns/moisture.jpg" },
  { v: "breakage", label: "Breakage", img: "/assets/hairConcerns/breakage.jpg" },
];
const s = Quiz.init(["concerns"]);
const saved = Array.isArray(s.concerns) ? s.concerns : [];
const form = document.getElementById("q");
for (const o of OPTS) {
  const lab = document.createElement("label");
  lab.className = "con-opt" + (saved.includes(o.v) ? " selected" : "");
  const inp = document.createElement("input");
  inp.type = "checkbox"; inp.name = "concerns"; inp.value = o.v;
  inp.checked = saved.includes(o.v);
  const img = document.createElement("img");
  img.className = "thumb"; img.src = o.img; img.alt = o.label; img.loading = "lazy";
  const name = document.createElement("span"); name.className = "name"; name.textContent = o.label;
  lab.append(inp, img, name);
  inp.addEventListener("change", () => lab.classList.toggle("selected", inp.checked));
  form.appendChild(lab);
}
document.getElementById("next").addEventListener("click", () => {
  const picked = [...form.querySelectorAll("input:checked")].map(i => i.value);
  Quiz.set({ concerns: picked });
});
</script>
</body>
</html>
